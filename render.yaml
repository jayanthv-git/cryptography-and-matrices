services:
  - type: web
    name: matrixcrypt-lab
    runtime: python
    plan: free
    branch: main
    rootDir: matrixcrypt-lab
    buildCommand: bash scripts/render-build.sh
    startCommand: python -m uvicorn backend.production:create_app --factory --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: NODE_VERSION
        value: 24.21.0
